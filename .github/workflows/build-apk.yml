name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            build-essential ccache \
            autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            libsqlite3-dev libbz2-dev liblzma-dev \
            libjpeg-dev libfreetype6-dev \
            patchelf

      - name: Cache Buildozer global dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Cache Buildozer project dir
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-proj-${{ hashFiles('buildozer.spec') }}

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install "cython==0.29.36" buildozer

      - name: Accept Android SDK licenses pre-emptively
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      - name: Build APK (debug)
        shell: bash
        run: |
          set -euo pipefail
          attempt=1
          max=3
          until buildozer -v android debug 2>&1 | tee build.log; do
            rc=${PIPESTATUS[0]}
            echo "::warning::buildozer failed (exit=$rc) on attempt $attempt"
            if [ $attempt -ge $max ]; then
              echo "::error::buildozer exhausted $max attempts"
              exit $rc
            fi
            attempt=$((attempt+1))
            sleep 15
          done
        env:
          ANDROID_SDK_ROOT: ""
          ANDROID_HOME: ""

      - name: Locate APK
        id: find_apk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          # Buildozer normally drops APKs in ./bin, but if the copy step is skipped
          # (e.g. due to a partial cache hit) the APK lives under .buildozer.
          shopt -s globstar nullglob
          found=( bin/*.apk )
          if [ ${#found[@]} -eq 0 ]; then
            echo "bin/ empty; searching .buildozer tree…"
            mapfile -t found < <(find .buildozer -type f -name '*.apk' 2>/dev/null)
            for f in "${found[@]}"; do cp -v "$f" bin/; done
          fi
          ls -lh bin/
          APK=$(ls bin/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK produced anywhere"
            exit 1
          fi
          echo "apk=$APK" >> $GITHUB_OUTPUT
          echo "Built: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: verdict-debug-apk-${{ github.sha }}
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
